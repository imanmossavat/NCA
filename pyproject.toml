[project]
name = "leafnca"
version = "0.1.0"
description = "A neural cellular automaton that grows and regrows a veined leaf"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
